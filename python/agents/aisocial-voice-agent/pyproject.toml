[project]
name = "aisocial-voice-agent"
version = "0.1.0"
description = "AISocialGrowth config-driven voice/chat agent built on Google ADK"
authors = [
    { name = "Bibin Lonappan", email = "bibinsmart@gmail.com" }
]
license = { text = "Apache License 2.0" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.5.0,<2.0.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.100.0,<2.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "google-adk>=1.5.0,<2.0.0",
    "pytest>=8.0.0",
]
deployment = [
    "absl-py>=2.2.2",
    "google-cloud-aiplatform[adk,agent-engines]>=1.100.0",
]

[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["aisocial_voice_agent"]

[tool.agent-starter-pack.settings]
agent_directory = "aisocial_voice_agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
